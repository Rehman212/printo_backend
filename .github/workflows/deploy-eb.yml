name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-eb-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Prisma generate already ran via postinstall; DATABASE_URL not needed for nest build
          DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public

      - name: Package for Elastic Beanstalk
        run: |
          zip -r deploy.zip . \
            -x "node_modules/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x ".agents/*" \
            -x ".env" \
            -x ".env.*" \
            -x "coverage/*" \
            -x "test/*" \
            -x "docs/*" \
            -x "uploads/*" \
            -x "tmp/*" \
            -x "*.md" \
            -x "*.log" \
            -x "deploy.zip" \
            -x "printoe-api-deploy.zip" \
            -x ".vscode/*" \
            -x ".idea/*" \
            -x ".DS_Store"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: printoe-api
          environment_name: printoe-api-env-3
          region: eu-west-1
          version_label: printoe-api-${{ github.sha }}
          version_description: ${{ github.event.head_commit.message || github.event_name }}
          deployment_package: deploy.zip
          wait_for_deployment: true
          wait_for_environment_recovery: 300
