services:
  api:
    build: .
    container_name: printoe-api
    restart: always
    env_file:
      - .env
    environment:
      SCRAPER_PREVIEW_URL: http://scraper:8877
    expose:
      - "8080"
    depends_on:
      - scraper

  scraper:
    build:
      context: ../scraperpython
    container_name: printoe-pricing
    restart: always
    environment:
      PRICING_SERVICE_ONLY: "1"
    expose:
      - "8877"

  caddy:
    image: caddy:2
    container_name: printoe-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
